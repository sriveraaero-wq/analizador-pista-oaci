const getARCNumber = length => {
  const l = parseFloat(length);
  if (isNaN(l) || l <= 0) return null;
  if (l < 800) return 1;
  if (l < 1200) return 2;
  if (l < 1800) return 3;
  return 4;
};

const runAudit = (data, arcNum, arcLetter, dd) => {
  const findings = [];
  let counter = 1;
  const today = new Date().toLocaleDateString("es-ES", {
    day: "2-digit",
    month: "2-digit",
    year: "numeric"
  });
  const addFinding = (severity, param, ref, found, required, description, recommendation) => {
    const prefix = severity === "NC" ? "NC" : "OB";
    findings.push({
      id: `${prefix}-${String(counter++).padStart(3, "0")}`,
      severity,
      param,
      ref,
      found,
      required,
      description,
      recommendation
    });
  };
  const length = parseFloat(data.length);
  const width = parseFloat(data.width);
  const slopeMax = parseFloat(data.slopeMax);
  const slopeQ1 = parseFloat(data.slopeQ1);
  const slopeQ4 = parseFloat(data.slopeQ4);
  const slopeTrans = parseFloat(data.slopeTrans);
  const limits = SLOPE_LIMITS[arcNum];
  const minWidth = MIN_WIDTHS[arcNum] && MIN_WIDTHS[arcNum][arcLetter];

  // ── Ancho de pista ─────────────────────────────────────────
  if (minWidth && !isNaN(width) && width < minWidth) {
    addFinding("NC", "Ancho de pista", "§3.1.12", `${width} m`, `${minWidth} m mín. para ARC ${arcNum}${arcLetter}`, `El ancho de pista declarado (${width} m) es inferior al mínimo requerido de ${minWidth} m para el ARC ${arcNum}${arcLetter}.`, `Ampliar el ancho de pista en ${minWidth - width} m mediante obras de ensanche lateral.`);
  }

  // ── Pendientes ─────────────────────────────────────────────
  if (!isNaN(slopeMax)) {
    if (slopeMax > limits.maxLong) addFinding("NC", "Pendiente longitudinal máxima", "§3.1.15", `${slopeMax}%`, `≤ ${limits.maxLong}% para núm. ref. ${arcNum}`, `La pendiente longitudinal máxima (${slopeMax}%) supera el límite de ${limits.maxLong}% para número de referencia ${arcNum}.`, `Corregir el perfil longitudinal mediante fresado, recapado o renivelación.`);
  } else {
    addFinding("OB", "Pendiente longitudinal máxima", "§3.1.15", "No declarada", "—", "No se declaró la pendiente longitudinal máxima.", "Declarar el dato para completar la evaluación.");
  }
  if (!isNaN(slopeQ1)) {
    if (slopeQ1 > limits.quarter) addFinding("NC", "Pendiente longitudinal — 1° cuarto", "§3.1.15", `${slopeQ1}%`, `≤ ${limits.quarter}%`, `La pendiente del primer cuarto de pista (${slopeQ1}%) supera el límite de ${limits.quarter}%.`, `Corregir el perfil longitudinal en el primer cuarto de pista.`);
  } else {
    addFinding("OB", "Pendiente longitudinal — 1° cuarto", "§3.1.15", "No declarada", "—", "No se declaró la pendiente del primer cuarto de pista.", "Declarar el dato para completar la evaluación.");
  }
  if (!isNaN(slopeQ4)) {
    if (slopeQ4 > limits.quarter) addFinding("NC", "Pendiente longitudinal — último cuarto", "§3.1.15", `${slopeQ4}%`, `≤ ${limits.quarter}%`, `La pendiente del último cuarto de pista (${slopeQ4}%) supera el límite de ${limits.quarter}%.`, `Corregir el perfil longitudinal en el último cuarto de pista.`);
  } else {
    addFinding("OB", "Pendiente longitudinal — último cuarto", "§3.1.15", "No declarada", "—", "No se declaró la pendiente del último cuarto de pista.", "Declarar el dato para completar la evaluación.");
  }
  if (!isNaN(slopeTrans) && slopeTrans > limits.transverse) addFinding("NC", "Pendiente transversal", "§3.1.17", `${slopeTrans}%`, `≤ ${limits.transverse}%`, `La pendiente transversal (${slopeTrans}%) excede el límite de ${limits.transverse}%.`, `Corregir el perfil transversal de la superficie de pista.`);

  // ── Distancias declaradas por RWY ──────────────────────────
  dd.forEach(item => {
    if (!item.coherent) addFinding("NC", `Coherencia de distancias — ${item.label}`, "§3.6.1", "Inconsistencia detectada", "TODA ≥ TORA, ASDA ≥ TORA, LDA ≤ TORA", `Las distancias declaradas para ${item.label} son inconsistentes. Verificar que TODA ≥ TORA, ASDA ≥ TORA y LDA ≤ TORA.`, `Revisar y corregir las distancias declaradas publicadas en el AIP.`);
    if (item.clearway > 0 && item.clearway > item.tora * 0.5) addFinding("NC", `Clearway — ${item.label}`, "§3.4.2", `${item.clearway} m`, `≤ ${item.tora * 0.5} m (50% TORA)`, `El clearway de ${item.label} (${item.clearway} m) supera el 50% de la TORA (${item.tora * 0.5} m).`, `Ajustar la longitud declarada del clearway o revisar la TORA.`);

    // ── Verificación por categoría de operación ───────────────
    if (item.opCat) {
