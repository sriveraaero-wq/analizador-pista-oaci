const getARCNumber = length => {
  const l = parseFloat(length);
  if (isNaN(l) || l <= 0) return null;
  if (l < 800) return 1;
  if (l < 1200) return 2;
  if (l < 1800) return 3;
  return 4;
};

// §3.1.13 — Pendiente media máxima (max-min / longitud total)
const MEAN_SLOPE_LIMITS = {
  1: 2.0,

// CAMBIO 9ª ed.: restricción 0.8% en cuartos para código 3 SOLO en CAT II/III

// Retorna el límite de cuartos según código y categoría de operación (9ª ed.)
const getQuarterLimit = (arcNum, opCat) => {
  if (arcNum === 4) return 0.8;
  if (arcNum === 3 && (opCat === "cat2" || opCat === "cat3")) return 0.8;
  if (arcNum === 3) return 1.5;
  return 2.0; // códigos 1 y 2
};

const getCompatibleLetters = arcNum => Object.keys(MIN_WIDTHS[parseInt(arcNum)] || {}).sort();
const inferLetter = (width, arcNum) => {
  const w = parseFloat(width);
  const widths = MIN_WIDTHS[arcNum];
  if (!widths || isNaN(w)) return "?";

const getElevationAlert = elev => {
  const e = parseFloat(elev);
  if (isNaN(e)) return null;
  if (e >= 3000) return {
    level: "danger",
    label: "Aeródromo de muy alta altitud (≥ 3 000 m)",
    note: "La longitud de campo de referencia puede ser 1,5× a 2× la requerida a nivel del mar. El ARC efectivo puede ser mayor al inferido. Se requiere análisis de performance con aeronave crítica."
  };
  if (e >= 1500) return {
    level: "warn",
    label: "Aeródromo de alta altitud (≥ 1 500 m)",
    note: "La longitud de campo de referencia aumenta significativamente con la altitud. Verificar con datos de performance de la aeronave crítica."
  };
  if (e >= 600) return {
    level: "info",
    label: "Aeródromo por encima del nivel base (≥ 600 m)",
    note: "Considerar corrección por altitud en longitud de campo de referencia."
  };
  return null;
};

const runAudit = (data, arcNum, arcLetter, dd) => {

  } else {
    addFinding("OB", "Pendiente longitudinal — 1° cuarto", "§3.1.15", "No declarada", "—", "No se declaró la pendiente del primer cuarto de pista.", "Declarar el dato para completar la evaluación.");
  }

    if (slopeQ4 > limits.quarter) addFinding("NC", "Pendiente longitudinal — último cuarto", "§3.1.15", `${slopeQ4}%`, `≤ ${limits.quarter}%`, `La pendiente del último cuarto de pista (${slopeQ4}%) supera el límite de ${limits.quarter}%.`, `Corregir el perfil longitudinal en el último cuarto de pista.`);
  } else {
    addFinding("OB", "Pendiente longitudinal — último cuarto", "§3.1.15", "No declarada", "—", "No se declaró la pendiente del último cuarto de pista.", "Declarar el dato para completar la evaluación.");
  }
  if (!isNaN(slopeTrans) && slopeTrans > limits.transverse) addFinding("NC", "Pendiente transversal", "§3.1.17", `${slopeTrans}%`, `≤ ${limits.transverse}%`, `La pendiente transversal (${slopeTrans}%) excede el límite de ${limits.transverse}%.`, `Corregir el perfil transversal de la superficie de pista.`);

  dd.forEach(item => {
    if (!item.coherent) addFinding("NC", `Coherencia de distancias — ${item.label}`, "§3.6.1", "Inconsistencia detectada", "TODA ≥ TORA, ASDA ≥ TORA, LDA ≤ TORA", `Las distancias declaradas para ${item.label} son inconsistentes. Verificar que TODA ≥ TORA, ASDA ≥ TORA y LDA ≤ TORA.`, `Revisar y corregir las distancias declaradas publicadas en el AIP.`);

      if (!isNaN(stripHalfActual) && stripHalfActual < halfW) addFinding("NC", "Semiancho de franja - " + item.label, stripRef, stripSource, halfW + " m c/lado para " + cat.short + " (Anexo 14 9a ed.)", "El semiancho de franja disponible (" + stripHalfActual + " m) es inferior al minimo de " + halfW + " m a cada lado del eje requerido para " + cat.short + " en " + item.label + ".", "Ampliar la franja libre de obstaculos a " + halfW + " m a cada lado del eje de pista (" + halfW * 2 + " m total).");
      if (cat.minLength && !isNaN(length) && length < cat.minLength) addFinding("OB", "Longitud referencial - " + item.label, "§3.1", length + " m", ">= " + cat.minLength + " m ref. para " + cat.short, "La longitud de pista (" + length + " m) es inferior a la longitud referencial minima (" + cat.minLength + " m) para " + cat.short + ". Sujeto a confirmacion con aeronave critica.", "Verificar longitud de campo de referencia de la aeronave critica. Puede requerirse extension de pista.");
    }
  });

  // ── Alerta por elevación del aeródromo ────────────────────
  const elevAlert = getElevationAlert(data.elevation);

    addFinding("OB", "Aeródromo de muy alta altitud - corrección por elevación", "§3.1", parseFloat(data.elevation) + " m AMSL", "Análisis de performance requerido", "La elevación del aeródromo (" + parseFloat(data.elevation).toFixed(0) + " m AMSL) requiere corrección significativa de la longitud de campo de referencia. El ARC inferido puede subestimar los requisitos reales.", "Realizar análisis de performance con aeronave crítica a la elevación e ISA+" + (data.tempRef ? (parseFloat(data.tempRef) - (15 - parseFloat(data.elevation) * 0.0065)).toFixed(1) : "X") + " para determinar el ARC efectivo.");

  }

  const obs = findings.filter(f => f.severity === "OB");

    findings,
    ncs,
    obs,
    status,
    date: today
  };
};
